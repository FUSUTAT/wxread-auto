name: wxread

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  schedule:
    # 北京时间每天 06:00 启动（UTC 22:00 前一天），由 multi_run.py 在 06:00-10:00 内分成 3~5 段随机执行
    - cron: '0 22 * * *'
    # 备用触发：北京时间每天 11:00，仅当近 14 小时没有成功的定时跑批时补跑
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      read_num:
        description: '精确次数（填入则立刻单段执行这么多次）'
        required: false
        default: ''
      total_min:
        description: '立即补跑分钟数（填入则现在分 2 段执行这么多分钟，留空走正常排程）'
        required: false
        default: ''

jobs:
  read:
    runs-on: ubuntu-22.04
    # 排程最长跨到 10:10 左右，留足余量
    timeout-minutes: 280
    permissions:
      actions: read
      contents: read
    steps:
      # checkout 放在最前面：判断步骤要用到仓库里的 ci_guard.py
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 备用触发时判断近 14 小时是否已成功
        id: guard
        if: github.event.schedule == '0 3 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GUARD_HOURS: '14'
        run: |
          # ci_guard.py 直接用 REST API 查询，不依赖 gh 的 git 上下文，也不用 jq
          if python ci_guard.py; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 分时段随机执行阅读任务
        if: github.event.schedule != '0 3 * * *' || steps.guard.outputs.skip != 'true'
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          BASE_NUM: ${{ vars.READ_NUM }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          manual="${{ github.event.inputs.read_num }}"
          minutes="${{ github.event.inputs.total_min }}"
          if [ -n "$manual" ]; then
            echo "手动触发：单段执行 $manual 次"
            READ_NUM=$manual python main.py
          elif [ -n "$minutes" ]; then
            echo "手动触发：立即分 2 段执行约 $minutes 分钟"
            python multi_run.py --now --total-min "$minutes" --segments 2
          else
            echo "分时段随机执行：06:00-10:00 窗口内 3~5 段，合计 70~80 分钟"
            python multi_run.py --start-hour 6 --end-hour 10
          fi

  keepalive:
    name: 保活（防止定时任务因仓库60天无活动被关闭）
    if: ${{ always() }}
    needs: read
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
