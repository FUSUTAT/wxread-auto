name: wxread

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  schedule:
    # 北京时间每天 06:00 启动（UTC 22:00 前一天），由 multi_run.py 在 06:00-10:00 内分成 3~5 段随机执行
    - cron: '0 22 * * *'
    # 备用触发：北京时间每天 11:00，仅当过去 14 小时内没有成功的定时任务时补跑
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      read_num:
        description: '阅读次数（留空则走分时段随机排程；填数字则立刻单段执行该次数）'
        required: false
        default: ''

jobs:
  read:
    runs-on: ubuntu-22.04
    # 排程最长跨到 10:10 左右，留足余量
    timeout-minutes: 280
    permissions:
      actions: read
      contents: read
    steps:
      - name: 备用触发时先判断近 14 小时是否已成功
        id: guard
        if: github.event.schedule == '0 3 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d '14 hours ago' +%s)
          ok=$(gh run list --workflow=wxread.yml --status=success --limit=40 \
               --json createdAt,event \
               -q "[.[] | select(.event==\"schedule\" and ((.createdAt|fromdateiso8601) > $since))] | length" || echo 0)
          echo "近 14 小时成功定时跑批次数：${ok:-0}"
          if [ "${ok:-0}" -gt 0 ]; then
            echo "当天主任务已成功，跳过补跑"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.event.schedule != '0 3 * * *' || steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: github.event.schedule != '0 3 * * *' || steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: github.event.schedule != '0 3 * * *' || steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 分时段随机执行阅读任务
        if: github.event.schedule != '0 3 * * *' || steps.guard.outputs.skip != 'true'
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          BASE_NUM: ${{ vars.READ_NUM }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          manual="${{ github.event.inputs.read_num }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$manual" ]; then
            echo "手动触发，单段执行 $manual 次（不等待随机排程）"
            READ_NUM=$manual python main.py
          else
            echo "分时段随机执行：06:00-10:00 窗口内 3~5 段，合计 70~80 分钟"
            python multi_run.py --start-hour 6 --end-hour 10
          fi

  keepalive:
    name: 保活（防止定时任务因仓库60天无活动被关闭）
    if: ${{ always() }}
    needs: read
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
