name: wxread

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  schedule:
    # 北京时间每天 09:00（UTC 01:00）。叠加脚本内的 0~40 分钟随机等待
    - cron: '0 1 * * *'
    # 备用触发：北京时间每天 23:20，仅当当天主任务失败时补跑
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      read_num:
        description: '阅读次数（可留空；留空则按 READ_NUM 变量 ±10 随机）'
        required: false
        default: ''

jobs:
  read:
    runs-on: ubuntu-22.04
    timeout-minutes: 160
    steps:
      - name: 备用触发时先判断当天是否已成功
        id: guard
        if: github.event.schedule == '20 15 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          ok=$(gh run list --workflow=wxread.yml --status=success --limit=30 \
               --json createdAt -q "[.[] | select(.createdAt | startswith(\"$today\"))] | length" || echo 0)
          if [ "${ok:-0}" -gt 0 ]; then
            echo "当天已有成功记录，跳过补跑"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.event.schedule != '20 15 * * *' || steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: github.event.schedule != '20 15 * * *' || steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: github.event.schedule != '20 15 * * *' || steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 随机延迟后执行阅读任务
        if: github.event.schedule != '20 15 * * *' || steps.guard.outputs.skip != 'true'
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          BASE_NUM: ${{ vars.READ_NUM }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            delay=0
          else
            delay=$(( RANDOM % 2400 ))
          fi
          echo "随机等待 ${delay} 秒（$(( delay / 60 )) 分钟）后开始"
          sleep $delay
          base=${BASE_NUM:-140}
          manual="${{ github.event.inputs.read_num }}"
          if [ -n "$manual" ]; then
            num=$manual
          else
            num=$(( base - 10 + RANDOM % 21 ))
          fi
          if [ "$num" -lt 1 ]; then num=1; fi
          echo "本次阅读 ${num} 次，约 $(( num / 2 )) 分钟"
          READ_NUM=$num python main.py

  keepalive:
    name: 保活（防止定时任务因仓库60天无活动被关闭）
    if: ${{ always() }}
    needs: read
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
