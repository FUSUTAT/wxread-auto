name: guard-test

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行 guard 判断
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GUARD_HOURS: '14'
        run: |
          set +e
          python ci_guard.py
          code=$?
          echo "退出码=$code"
          if [ "$code" -eq 0 ]; then echo "结论：跳过补跑"; else echo "结论：执行补跑"; fi
